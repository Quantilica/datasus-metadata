name: Public hygiene

# Veta termos internos (planos, decisões, repositórios privados, infraestrutura)
# em CHANGELOG.md, README e nas mensagens de commit de PRs. O repositório é
# público: o que entra aqui fica no histórico para sempre.
# Regra: docs/normas/changelog.md, seção 5.1. A lista de termos é o segredo de
# organização HYGIENE_TERMS (privado); não a coloque neste arquivo.
# Falso positivo legítimo: termine a linha com `<!-- hygiene-ok -->`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Termos internos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ler lista de termos (segredo da organização)
        env:
          HYGIENE_TERMS: ${{ secrets.HYGIENE_TERMS }}
        run: |
          if [ -z "$HYGIENE_TERMS" ]; then
            echo "::warning::Segredo HYGIENE_TERMS indisponível (PR de fork?). Verificação de termos internos ignorada."
            exit 0
          fi
          printf '%s\n' "$HYGIENE_TERMS" > "$RUNNER_TEMP/termos-brutos.txt"
          awk '/^#--arquivos--$/ {exit} NF' "$RUNNER_TEMP/termos-brutos.txt" \
            > "$RUNNER_TEMP/termos-comuns.txt"
          awk '/^#--arquivos--$/ {f=1; next} f && NF' "$RUNNER_TEMP/termos-brutos.txt" \
            > "$RUNNER_TEMP/termos-arquivos.txt"
          cat "$RUNNER_TEMP/termos-comuns.txt" "$RUNNER_TEMP/termos-arquivos.txt" \
            > "$RUNNER_TEMP/termos-todos.txt"

      - name: CHANGELOG e README
        run: |
          [ -s "$RUNNER_TEMP/termos-todos.txt" ] || { echo "Sem lista de termos; verificação ignorada."; exit 0; }
          files=$(ls CHANGELOG.md README*.md docs/changelog.md 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "Nenhum CHANGELOG/README para verificar."
            exit 0
          fi
          # shellcheck disable=SC2086
          hits=$(grep -nIiE -f "$RUNNER_TEMP/termos-todos.txt" $files /dev/null \
            | grep -v 'hygiene-ok' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Termos internos em changelog/README. Reescreva em termos públicos (docs/normas/changelog.md, seção 5.1)."
            exit 1
          fi
          echo "Limpo."

      - name: Mensagens de commit do PR
        if: github.event_name == 'pull_request'
        run: |
          [ -s "$RUNNER_TEMP/termos-todos.txt" ] || { echo "Sem lista de termos; verificação ignorada."; exit 0; }
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          msgs=$(git log --format='%h %s%n%b' "$range")
          hits=$(printf '%s\n' "$msgs" \
            | grep -iE -f "$RUNNER_TEMP/termos-comuns.txt" \
            | grep -v 'hygiene-ok' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Termos internos em mensagem de commit. Reescreva o commit (docs/normas/changelog.md, seção 5.1)."
            exit 1
          fi
          echo "Limpo."

  zizmor:
    name: Audit de workflows (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: false

      - name: Audit workflows with zizmor
        run: uvx zizmor --no-online-audits --min-severity high .github/workflows
